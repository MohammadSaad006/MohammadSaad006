name: Refresh Snake

on:
  # refresh every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # "Run workflow" button in the Actions tab
  workflow_dispatch:
  # also runs once when you push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Generate gold snake from my contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#F5D76E&color_dots=#1c1912,#5c4a12,#9a7b1c,#D4AF37,#FFF1B8&color_dot_border=#ffffff0d

      - name: Add dark frame and commit to assets/snake.svg
        run: |
          python3 - <<'PY'
          import re
          p = "dist/snake.svg"
          s = open(p, encoding="utf-8").read()
          x, y, w, h = (int(v) for v in re.search(r'viewBox="(-?\d+) (-?\d+) (\d+) (\d+)"', s).groups())
          i = s.index(">") + 1
          bg = f'<rect x="{x}" y="{y}" width="{w}" height="{h}" rx="18" fill="#0b0b10"/>'
          lab = '<text x="0" y="-12" font-family="monospace" font-size="11" letter-spacing="3" fill="#8f8566">CONTRIBUTION MAP</text>'
          fr = f'<rect x="{x+1}" y="{y+1}" width="{w-2}" height="{h-2}" rx="18" fill="none" stroke="#D4AF37" stroke-opacity=".45" stroke-width="1.5"/>'
          s = s[:i] + bg + lab + s[i:]
          s = s.replace("</svg>", fr + "</svg>")
          open(p, "w", encoding="utf-8").write(s)
          PY
          mkdir -p assets
          cp dist/snake.svg assets/snake.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/snake.svg
          if git diff --cached --quiet; then
            echo "snake unchanged"
          else
            git commit -m "chore: refresh contribution snake"
            git push
          fi
